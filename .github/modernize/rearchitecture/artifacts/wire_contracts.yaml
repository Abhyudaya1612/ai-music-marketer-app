      request: "Bearer-authenticated owner-scoped request; POST requires a completed analysis and active rights, audio-processing, and derived-analysis-storage authorization"
      response: "GET returns the latest saved five-agent output or null; POST runs the deterministic pipeline and returns its output plus explicit heuristic/simulation limitations"
