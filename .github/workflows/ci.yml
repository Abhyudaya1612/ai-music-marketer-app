name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install essentia (optional)
        run: |
          pip install essentia>=2.1b6 || echo 'essentia not available, key detection tests will be skipped'
        continue-on-error: true

      - name: Run tests with coverage
        env:
          APP_AI_PROVIDER: mock
        run: |
          pytest tests/ -v --cov=backend --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  frontend-check:
    # Only run if frontend exists (package.json at repo root or frontend/)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - frontend_path: frontend
          - frontend_path: .

    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check_frontend
        run: |
          if [ -f "${{ matrix.frontend_path }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js 20
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          cd ${{ matrix.frontend_path }}
          npm ci

      - name: Type check
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          cd ${{ matrix.frontend_path }}
          npm run type-check || tsc --noEmit || true

      - name: Build
        if: steps.check_frontend.outputs.exists == 'true'
        run: |
          cd ${{ matrix.frontend_path }}
          npm run build || true
