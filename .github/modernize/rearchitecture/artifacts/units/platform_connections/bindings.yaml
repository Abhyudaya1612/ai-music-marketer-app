unit: platform_connections
bindings:
  - {type: route-declaration, name: "GET /api/v1/connections", source_loc: "backend/routers/connections.py:162", target: "list_platform_connections", must_appear_in_target: true, notes: "Owner-scoped, token-free status for the fixed YouTube, Instagram, and Facebook providers."}
  - {type: route-declaration, name: "POST /api/v1/connections/{provider}/oauth/start", source_loc: "backend/routers/connections.py:176", target: "start_platform_oauth", must_appear_in_target: true, notes: "Requires separate workspace platform-account consent, configured callbacks, and encryption key; creates ten-minute one-time state."}
  - {type: route-declaration, name: "GET /api/v1/connections/oauth/callback/{provider}", source_loc: "backend/routers/connections.py:206", target: "finish_platform_oauth", must_appear_in_target: true, notes: "Provider callback is unauthenticated but bound to a one-time hash-backed owner state; exchanges credentials server-side and redirects only to configured APP_FRONTEND_URL."}
  - {type: route-declaration, name: "DELETE /api/v1/connections/{provider}", source_loc: "backend/routers/connections.py:240", target: "disconnect_platform", must_appear_in_target: true, notes: "Deletes local credentials and account details; provider-side grants may need separate revocation."}
  - {type: convention, name: "Provider OAuth implementation", source_loc: "backend/services/platform_oauth.py:123", target: "build_authorization_url/exchange_authorization_code", must_appear_in_target: true, notes: "Request only youtube.readonly, instagram_business_basic, or public_profile; never request publishing or write scopes."}
  - {type: convention, name: "Encrypted provider token storage", source_loc: "backend/services/platform_oauth.py:104", target: "encrypt_token/decrypt_token", must_appear_in_target: true, notes: "Fernet key supplied by APP_TOKEN_ENCRYPTION_KEY; tokens never appear in API responses or frontend storage."}
runtime_config:
  - {key: APP_TOKEN_ENCRYPTION_KEY, source_loc: "backend/config.py:27", source: env, default_value: "", must_appear_in_target: true, notes: "Required Fernet key; losing/changing it makes previously stored tokens unreadable."}
  - {key: APP_FRONTEND_URL, source_loc: "backend/config.py:28", source: env, default_value: "http://localhost:3000", must_appear_in_target: true, notes: "Fixed callback return origin; never accept a callback redirect destination from the browser."}
  - {key: APP_YOUTUBE_OAUTH_CLIENT_ID/SECRET/REDIRECT_URI, source_loc: "backend/config.py:29", source: env, default_value: "", must_appear_in_target: true, notes: "Google OAuth client and exact registered callback URI."}
  - {key: APP_INSTAGRAM_OAUTH_CLIENT_ID/SECRET/REDIRECT_URI, source_loc: "backend/config.py:32", source: env, default_value: "", must_appear_in_target: true, notes: "Instagram Login app credentials and exact registered callback URI."}
  - {key: APP_FACEBOOK_OAUTH_CLIENT_ID/SECRET/REDIRECT_URI, source_loc: "backend/config.py:35", source: env, default_value: "", must_appear_in_target: true, notes: "Facebook Login app credentials and exact registered callback URI."}
