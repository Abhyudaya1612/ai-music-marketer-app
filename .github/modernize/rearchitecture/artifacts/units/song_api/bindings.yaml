unit: song_api
bindings:
  - {type: route-declaration, name: "POST /api/songs", source_loc: "backend/routers/songs.py:25", target: "create_song", must_appear_in_target: true, notes: "201 response; queues current analysis pipeline."}
  - {type: route-declaration, name: "GET /api/songs and GET /api/songs/{song_id}", source_loc: "backend/routers/songs.py:37", target: "list_songs/get_song", must_appear_in_target: true, notes: "Preserve legacy response models and ordering."}
  - {type: route-declaration, name: "POST /api/songs/{song_id}/analyze", source_loc: "backend/routers/songs.py:97", target: "reanalyze_song", must_appear_in_target: true, notes: "Legacy reanalysis route."}
  - {type: route-declaration, name: "POST /api/v1/songs/{song_id}/assets/upload-intent; PUT /api/v1/assets/{asset_id}/upload", source_loc: "backend/routers/v1.py:469", target: "create_upload_intent/upload_asset", must_appear_in_target: true, notes: "Creates a private UUID-keyed upload intent and accepts bounded streamed audio bytes after rights declaration and processing consent checks."}
  - {type: route-declaration, name: "GET/PUT /api/v1/artist/profile; GET /api/v1/songs", source_loc: "backend/routers/v1.py:255", target: "get_artist_profile/upsert_artist_profile/list_songs", must_appear_in_target: true, notes: "Profile and catalog reads/writes are scoped to current_owner; catalog uses a bounded cursor page."}
  - {type: route-declaration, name: "GET/POST /api/v1/consents; POST /api/v1/consents/{consent_id}/withdraw; GET/POST /api/v1/rights/declarations", source_loc: "backend/routers/v1.py:288", target: "list_consents/create_consent/withdraw_consent/list_rights_declarations/create_rights_declaration", must_appear_in_target: true, notes: "Persists owner-scoped grant/withdrawal events separately from rights declarations."}
  - {type: route-declaration, name: "POST /api/v1/songs/{song_id}/analyses", source_loc: "backend/routers/v1.py:646", target: "create_analysis", must_appear_in_target: true, notes: "Requires verified private audio, rights/processing/storage consent, a separate third-party AI grant when requested, and an idempotency key; optionally accepts bounded artist-supplied lyrics for local-derived analysis."}
  - {type: route-declaration, name: "GET /api/v1/analyses/{analysis_id}/audience-hypotheses", source_loc: "backend/routers/v1.py:810", target: "get_audience_hypotheses", must_appear_in_target: true, notes: "Owner-scoped, on-demand hypotheses are evidence-linked and uncertainty-labeled; no platform or demographic predictions are made."}
  - {type: route-declaration, name: "GET /api/v1/songs/{song_id}/release-plans; POST /api/v1/release-plans; GET/PATCH /api/v1/release-plans/{plan_id}; POST /api/v1/release-plans/{plan_id}/approve", source_loc: "backend/routers/v1.py:856", target: "list/create/get/update/approve_release_plan", must_appear_in_target: true, notes: "Owner-scoped local organic-first release calendar with an idempotent create operation; approval is not consent to execute publishing, distributor, account, or paid-campaign actions."}
  - {type: route-declaration, name: "GET /api/v1/capabilities", source_loc: "backend/routers/v1.py:309", target: "capabilities", must_appear_in_target: true, notes: "Public capability flags must reflect installed local FFmpeg/FFprobe features and must not promise unsupported video-generation modes."}
  - {type: convention, name: "Social provider capability discovery", source_loc: "backend/routers/v1.py:316", target: "platform_oauth.provider_is_configured", must_appear_in_target: true, notes: "Provider readiness requires credentials, exact callback configuration, and a valid encryption key; this flag does not imply any publishing capability."}
  - {type: route-declaration, name: "GET/POST /api/v1/songs/{song_id}/video-renders; GET /api/v1/video-renders/{render_id}; GET /api/v1/video-renders/{render_id}/download", source_loc: "backend/routers/v1.py:1032", target: "list_video_renders/create_video_render/get_video_render/download_video_render", must_appear_in_target: true, notes: "Requires current rights plus active audio-processing and promotional-media consent; creates idempotent asynchronous work and serves only completed private MP4s to the owner."}
  - {type: convention, name: "Local video renderer capability and scene planning", source_loc: "backend/services/video_rendering.py:241", target: "renderer_capabilities/build_scene_plan", must_appear_in_target: true, notes: "Supports only the two approved initial formats; deterministic graphics must not be represented as AI-generated cinematic footage."}
runtime_config: []
